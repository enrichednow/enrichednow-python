name: Release

# Pushing a tag vX.Y.Z publishes that version to PyPI.
#
# No token is stored anywhere: PyPI trusts this workflow through OpenID Connect ("trusted publishing"). PyPI must
# have a trusted publisher for owner "enrichednow", repository "enrichednow-python", workflow "release.yml",
# environment "pypi". Without one the publish step is refused and nothing is uploaded.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build
    if: github.repository == 'enrichednow/enrichednow-python'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: The tag is the version in pyproject.toml
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::the tag is $GITHUB_REF_NAME but pyproject.toml says $version"
            exit 1
          fi
      - run: python -m pip install --upgrade pip build twine
      - run: pip install -e ".[dev]"
      - run: pytest
      - run: mypy
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/enrichednow/
    permissions:
      id-token: write # the OpenID Connect token PyPI checks; this job has no other credential
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
