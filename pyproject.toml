[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enrichednow"
version = "0.3.0"
description = "The official Python library for the EnrichedNow API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "EnrichedNow" }]
keywords = ["enrichednow", "api", "jobs", "datasets"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.23,<1"]

[project.optional-dependencies]
dev = ["pytest>=7", "mypy>=1.8"]

[project.urls]
Homepage = "https://enrichednow.com"
Documentation = "https://docs.enrichednow.com"
Repository = "https://github.com/enrichednow/enrichednow-python"
Issues = "https://github.com/enrichednow/enrichednow-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/enrichednow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
strict = true
python_version = "3.9"
files = ["src/enrichednow"]
